<script>
const p=JSON.parse(localStorage.getItem("manamart_product"));
if(p){
 const box=document.querySelector(".products");
 const card=document.createElement("div");
 card.className="card";
 card.innerHTML=`
  <div class="img">${p.emoji}</div>
  <h3>${p.name}</h3>
  <p>₹${p.price}</p>
  <button onclick="addCart()">Add to Cart</button>`;
 box.prepend(card);
}
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ManaMart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f7fb}
header{background:#1565C0;color:#fff;padding:15px}
.search{width:100%;padding:12px;border:none;border-radius:10px;margin-top:10px}
.hero{margin:15px;background:linear-gradient(135deg,#1565C0,#42A5F5);color:#fff;padding:20px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px}
.cat,.card{background:#fff;border-radius:12px;padding:12px;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
button{background:#1565C0;color:#fff;border:none;padding:10px;border-radius:8px;width:100%}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
footer a{text-decoration:none;color:#222;text-align:center;font-size:13px}
</style>
</head>
<body>

<header>
<h2>🛒 ManaMart</h2>
<input class="search" placeholder="Search products...">
</header>

<div class="hero">
<h2>Shop Local • Support Local</h2>
<p>90% Owner • 10% ManaMart</p>
<button onclick="window.location.href='seller.html'">Become a Seller</button>
</div>

<div class="grid">
<div class="cat">👕 Clothes</div>
<div class="cat">👟 Shoes</div>
<div class="cat">📱 Mobiles</div>
<div class="cat">🍚 Grocery</div>
<div class="cat">💄 Beauty</div>
<div class="cat">🪑 Furniture</div>
</div>

<div class="products">
<div class="card"><h3>Running Shoes</h3><p>₹999</p><button>Add to Cart</button></div>
<div class="card"><h3>Black T-Shirt</h3><p>₹499</p><button>Add to Cart</button></div>
<div class="card"><h3>Smart Watch</h3><p>₹1499</p><button>Add to Cart</button></div>
<div class="card"><h3>Headphones</h3><p>₹799</p><button>Add to Cart</button></div>
</div>

<div style="height:80px"></div>

<footer>
<a href="index.html">🏠<br>Home</a>
<a href="orders.html">📦<br>Orders</a>
<a href="cart.html">🛒<br>Cart</a>
<a href="profile.html">👤<br>Profile</a>
</footer>

</body>
</html>
