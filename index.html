<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaMart</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb}
header{background:#0d47a1;color:#fff;padding:15px}
.search{width:100%;padding:12px;border-radius:10px;border:none}
.hero{background:#1565c0;color:#fff;margin:15px;padding:20px;border-radius:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px}
.cat,.card{background:#fff;border-radius:12px;padding:12px;text-align:center}
.card{margin:15px}
button{background:#1565c0;color:#fff;border:none;padding:10px 15px;border-radius:8px}
</style>
</head>
<body>

<header>
  <h2>🛒 ManaMart</h2>
  <input class="search" placeholder="Search products...">
</header>

<div class="hero">
  <h2>Shop Local, Support Local</h2>
  <p>90% Owner • 10% ManaMart</p>
  <button>Become a Seller</button>
</div>

<div class="grid">
  <div class="cat">👕 Clothes</div>
  <div class="cat">👟 Shoes</div>
  <div class="cat">📱 Mobiles</div>
  <div class="cat">🍚 Grocery</div>
  <div class="cat">💄 Beauty</div>
  <div class="cat">🪑 Furniture</div>
</div>

<div class="card">
  <h3>Running Shoes</h3>
  <p>₹999</p>
  <button>Add to Cart</button>
</div>

<div class="card">
  <h3>Black T-Shirt</h3>
  <p>₹499</p>
  <button>Add to Cart</button>
</div>

<div class="card">
  <h3>Seller Registration</h3>
  <input placeholder="Shop Name"><br><br>
  <input placeholder="Phone Number"><br><br>
  <button>Register</button>
</div>

</body>
</html>
