<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManaMart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f7fb;color:#222}
header{background:#1565C0;color:#fff;padding:15px;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:bold}
.search input{width:100%;padding:12px;border:none;border-radius:10px;margin-top:10px}
.banner{margin:15px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#1565C0,#42A5F5);color:#fff}
.banner button{margin-top:10px;background:#fff;color:#1565C0;border:none;padding:10px 15px;border-radius:8px;font-weight:bold}
.section{padding:15px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.cat{background:#fff;padding:12px;border-radius:12px;text-align:center;font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:90px}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.price{color:#1565C0;font-weight:bold;margin:5px 0}
.buy{width:100%;padding:10px;background:#1565C0;color:#fff;border:none;border-radius:8px}
.cartFloat{position:fixed;right:15px;bottom:75px;background:#1565C0;color:#fff;padding:12px 16px;border-radius:30px;font-weight:bold}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
footer button{background:none;border:none;font-size:13px}
</style>
</head>
<body>

<header>
<div class="logo">🛒 ManaMart</div>
<div class="search">
<input id="search" placeholder="Search products...">
</div>
</header>

<div class="banner">
<h2>Big Sale 🔥</h2>
<p>Up to 50% OFF • Shop Local • Support Local</p>
<button onclick="alert('Seller Dashboard next update lo add chestam')">Become a Seller</button>
</div>

<div class="section">
<h2>Categories</h2>

<div class="categories">
<div class="cat">👕</div>
<div class="cat">👟</div>
<div class="cat">📱</div>
<div class="cat">🍚</div>
<div class="cat">💄</div>
<div class="cat">⌚</div>
<div class="cat">🎧</div>
<div class="cat">🪑</div>
</div>

<h2>Trending Products</h2>

<div class="products" id="products">

<div class="card" data-name="Nike Shoes">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
<h3>Nike Shoes</h3>
<div class="price">₹2,499</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Puma Shoes">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=400">
<h3>Puma Sneakers</h3>
<div class="price">₹1,999</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Black T Shirt">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400">
<h3>Black T-Shirt</h3>
<div class="price">₹499</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Smart Watch">
<img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400">
<h3>Smart Watch</h3>
<div class="price">₹1,499</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Headphones">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400">
<h3>Headphones</h3>
<div class="price">₹799</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Office Chair">
<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400">
<h3>Office Chair</h3>
<div class="price">₹2,999</div>
<button class="buy" onclick="addCart()">Add to Cart</button>
</div>

</div>
</div>

<div class="cartFloat">🛒 <span id="count">0</span></div>

<footer>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠<br>Home</button>
<button onclick="alert('Orders feature coming soon')">📦<br>Orders</button>
<button onclick="alert('Cart Items: '+cart)">🛒<br>Cart</button>
<button onclick="alert('Profile feature coming soon')">👤<br>Profile</button>
</footer>

<script>
let cart=Number(localStorage.getItem("cart")||0);
document.getElementById("count").innerText=cart;

function addCart(){
  cart++;
  localStorage.setItem("cart",cart);
  document.getElementById("count").innerText=cart;
  alert("Product added to cart!");
}

document.getElementById("search").addEventListener("input",function(){
  let q=this.value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display=card.dataset.name.toLowerCase().includes(q)?"block":"none";
  });
});
</script>

</body>
</html>
