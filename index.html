<!DOCTYPE html>
<html lang="en">
<head> <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ManaMart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fb}
header{background:#1565C0;color:white;padding:15px;position:sticky;top:0}
.logo{font-size:28px;font-weight:bold}
.search input{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px}
.banner{margin:15px;background:linear-gradient(135deg,#1565C0,#42A5F5);color:white;padding:20px;border-radius:18px}
.banner button{margin-top:10px;padding:10px 15px;border:none;border-radius:8px;background:white;color:#1565C0;font-weight:bold}
.section{padding:0 15px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.cat{background:white;padding:12px;border-radius:12px;text-align:center}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:90px}
.card{background:white;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.price{color:#1565C0;font-weight:bold;margin:5px 0}
button.buy{width:100%;padding:10px;border:none;border-radius:8px;background:#1565C0;color:white}
.cart{position:fixed;right:15px;bottom:75px;background:#1565C0;color:white;padding:12px 16px;border-radius:30px;font-weight:bold}
footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
footer a{text-decoration:none;color:#222;text-align:center;font-size:13px}
</style>
</head>
<body>

<header>
<div class="logo">🛒 ManaMart</div>
<div class="search">
<input id="search" placeholder="Search products...">
</div>
</header>

<div class="banner">
<h2>Big Sale 🔥</h2>
<p>Up to 50% OFF • Shop Local • Support Local</p>
<button onclick="location.href='seller.html'">Become a Seller</button>
</div>

<div class="section">
<h2>Categories</h2>

<div class="categories">
<div class="cat">👕</div>
<div class="cat">👟</div>
<div class="cat">📱</div>
<div class="cat">🍚</div>
<div class="cat">💄</div>
<div class="cat">🪑</div>
<div class="cat">⌚</div>
<div class="cat">🎧</div>
</div>

<h2>Trending Products</h2>

<div class="products" id="products">

<div class="card" data-name="Running Shoes">
  <img src="https://picsum.photos/300/200?1">
  <h3>Running Shoes</h3>
  <div class="price">₹999</div>
  <button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Black T-Shirt">
  <img src="https://picsum.photos/300/200?2">
  <h3>Black T-Shirt</h3>
  <div class="price">₹499</div>
  <button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Smart Watch">
  <img src="https://picsum.photos/300/200?3">
  <h3>Smart Watch</h3>
  <div class="price">₹1499</div>
  <button class="buy" onclick="addCart()">Add to Cart</button>
</div>

<div class="card" data-name="Headphones">
  <img src="https://picsum.photos/300/200?4">
  <h3>Headphones</h3>
  <div class="price">₹799</div>
  <button class="buy" onclick="addCart()">Add to Cart</button>
</div>

</div>
</div>

<div class="cart">🛒 <span id="count">0</span></div>

<footer>
<a href="index.html">🏠<br>Home</a>
<a href="orders.html">📦<br>Orders</a>
<a href="cart.html">🛒<br>Cart</a>
<a href="profile.html">👤<br>Profile</a>
</footer>

<script>
let cart=0;

function addCart(){
  cart++;
  document.getElementById("count").innerText=cart;
  localStorage.setItem("cart",cart);
}
 document.getElementById("count").innerText=cart;
}

document.getElementById("search").addEventListener("input",function(){
 let q=this.value.toLowerCase();
 document.querySelectorAll(".card").forEach(card=>{
  card.style.display=card.dataset.name.toLowerCase().includes(q)?"block":"none";
 });
});
</script>

</body>
</html>
